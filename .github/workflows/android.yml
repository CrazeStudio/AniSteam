name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Remove older AniSteam APK artifacts to free storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "AniSteam-debug" and .expired == false) | .id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || true
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniSteam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
