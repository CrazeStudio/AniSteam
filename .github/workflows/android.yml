name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Remove older AniSteam APK artifacts to free storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "AniSteam-debug" and .expired == false) | .id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || true
          done
      # Release assets do not consume GitHub Actions artifact storage quota.
      - name: Publish latest APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete anisteam-debug --yes --cleanup-tag || true
          gh release create anisteam-debug app/build/outputs/apk/debug/app-debug.apk \
            --title "AniSteam Latest Debug APK" \
            --notes "Latest successful AniSteam debug build from commit ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
