name: Build AniSteam APK

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tools/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-apk.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tools/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, and build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.yaml
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.crazestudio --project-name anisteam --no-pub .
      - name: Ensure Android internet permission
        shell: bash
        run: |
          set -euo pipefail
          manifest="android/app/src/main/AndroidManifest.xml"
          test -f "$manifest"
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest\b/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi
          grep -q 'android.permission.INTERNET' "$manifest"
      - name: Set Android launcher label and icon
        shell: bash
        run: |
          set -euo pipefail
          strings="android/app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "$strings")"
          cat > "$strings" <<'XML'
          <resources>
              <string name="app_name">AniSteam</string>
          </resources>
          XML
          manifest="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, n = re.subn(r'<application\b', '<application', s, count=1)
          if not n:
              raise SystemExit("Android application element not found")
          s = re.sub(r'android:label="[^"]*"', 'android:label="@string/app_name"', s, count=1)
          if 'android:label=' not in s:
              s = s.replace('<application', '<application android:label="@string/app_name"', 1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', s, count=1)
          if 'android:icon=' not in s:
              s = s.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
          s = re.sub(r'\s+android:roundIcon="[^"]*"', '', s)
          p.write_text(s)
          assert 'android:label="@string/app_name"' in s
          assert 'android:icon="@mipmap/ic_launcher"' in s
          PY
          grep -q '<string name="app_name">AniSteam</string>' "$strings"
          test -s tools/generate_launcher_icons.py

      - name: Generate branded AniSteam launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/anisteam-icon-venv
          /tmp/anisteam-icon-venv/bin/python -m pip install --quiet --upgrade pip pillow
          /tmp/anisteam-icon-venv/bin/python tools/generate_launcher_icons.py
      - name: Probe configured API health (diagnostic)
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('lib/main.dart', 'utf8');
          const match = source.match(/const defaultApiBase = '([^']+)'/);
          if (!match) { console.warn('Service health check skipped: configured endpoint was not found.'); process.exit(0); }
          fetch(`${match[1]}/health`, { signal: AbortSignal.timeout(12000) })
            .then(async response => {
              if (!response.ok) throw new Error('health status not OK');
              const payload = await response.json();
              if (payload.status !== 'ok') throw new Error('health payload not OK');
              console.log('Service health check passed.');
            })
            .catch(() => { console.warn('Service health check failed from the build runner (DNS/network/HTTP).'); process.exitCode = 1; });
          NODE
      - name: Resolve packages
        run: flutter pub get
      - name: Patch WebView Gradle compatibility
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gradle_files < <(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/flutter_inappwebview_android-*/android/build.gradle' -type f)
          if [ "${#gradle_files[@]}" -eq 0 ]; then
            echo "flutter_inappwebview Android Gradle file not found"
            exit 1
          fi
          for file in "${gradle_files[@]}"; do
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$file"
            if grep -q "proguard-android\.txt" "$file"; then
              echo "Legacy ProGuard rules reference remains in $file"
              exit 1
            fi
          done
          echo "WebView Android Gradle compatibility patch applied."

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniSteam-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
