name: Build AniSteam APK

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-apk.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, and build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.yaml
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.crazestudio --project-name anisteam --no-pub .
      - name: Ensure Android internet permission
        shell: bash
        run: |
          set -euo pipefail
          manifest="android/app/src/main/AndroidManifest.xml"
          test -f "$manifest"
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest\b/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi
          grep -q 'android.permission.INTERNET' "$manifest"
      - name: Set Android launcher label
        shell: bash
        run: |
          set -euo pipefail
          strings="android/app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "$strings")"
          cat > "$strings" <<'XML'
          <resources>
              <string name="app_name">AniSteam</string>
          </resources>
          XML
          grep -q '<string name="app_name">AniSteam</string>' "$strings"
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.webp

      - name: Apply AniSteam-2 launcher logo
        shell: bash
        run: |
          set -euo pipefail
          res="android/app/src/main/res"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$res/mipmap-$density"
            for icon in ic_launcher ic_launcher_round; do
              base64 -d ".github/assets/launcher/$density-$icon.b64" > "$res/mipmap-$density/$icon.webp"
              rm -f "$res/mipmap-$density/$icon.png"
            done
          done
          rm -f "$res"/mipmap-anydpi-v26/ic_launcher.xml "$res"/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Probe configured API health (diagnostic)
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('lib/main.dart', 'utf8');
          const match = source.match(/const defaultApiBase = '([^']+)'/);
          if (!match) { console.warn('Service health check skipped: configured endpoint was not found.'); process.exit(0); }
          fetch(`${match[1]}/health`, { signal: AbortSignal.timeout(12000) })
            .then(async response => {
              if (!response.ok) throw new Error('health status not OK');
              const payload = await response.json();
              if (payload.status !== 'ok') throw new Error('health payload not OK');
              console.log('Service health check passed.');
            })
            .catch(() => { console.warn('Service health check failed from the build runner (DNS/network/HTTP).'); process.exitCode = 1; });
          NODE
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniSteam-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
