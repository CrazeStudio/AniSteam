name: anisteam
description: AniSteam Flutter anime discovery and playback client.
publish_to: "none"
version: 1.0.1+2
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: 2.5.6
  # Keep the Dart and Android implementation aligned; 2.5.0 uses the matching JNI-backed bridge.
  shared_preferences_android: 2.5.0
  url_launcher: ^6.3.1
  video_player: ^2.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/anisteam_logo.webp
